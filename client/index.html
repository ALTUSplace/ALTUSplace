    <script type="application/ld+json">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- LCP: preload the homepage hero image (matches Home.tsx, fetchpriority high) -->
    <link rel="preload" as="image" fetchpriority="high" href="https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&q=80&w=900">
    <!-- Fonts, Arabic-first. Tajawal is the only Arabic face; Plus Jakarta Sans
         covers Latin + numerals. Cairo dropped: it sat BEHIND Tajawal in every
         stack, so it never painted — 79 KB of pure fallback liability.
         Fraunces dropped: only ever used as a mono face, for card numbers and
         ticket IDs. No italic axis: the one real <em> is a single letter in the
         internal ComponentShowcase page, so the browser's oblique is fine.
         display=fallback, not swap — Tajawal ships Latin glyphs, so swap renders
         fr/en LCP in the wrong typeface first, then reflows. See index.css. -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&family=Tajawal:wght@400;500;700;800&display=fallback" rel="stylesheet">
    <style>
      body { font-family: 'Plus Jakarta Sans', 'Tajawal', system-ui, sans-serif; background-color: #FFFFFF; color: #1C1C1E; }
      .dark body { background-color: #0F1115; color: #F2F3F5; }
    </style>
    <script>
      // Anti-FOUC: apply the persisted (or OS-preferred) theme before first
      // paint so dark-mode users never see a white flash. Kept in sync with
      // client/src/contexts/ThemeContext.tsx (localStorage key: "theme").
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme = stored === "light" || stored === "dark"
            ? stored
            : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          var root = document.documentElement;
          if (theme === "dark") {
            root.classList.add("dark");
            root.style.colorScheme = "dark";
          } else {
            root.style.colorScheme = "light";
          }
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "dark" ? "#0F1115" : "#FFFFFF");
        } catch (e) {
          /* ignore — storage unavailable */
        }
      })();
    </script>
    <meta name="google-site-verification" content="lNnaQsehc6JyU_JHI3aLsxGpNqonOU5DHJQr3CPS_Z8" />
  </head>
  <body class="antialiased">
    <div id="root"></div>

  </body>
