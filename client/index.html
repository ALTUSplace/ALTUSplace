    <script type="application/ld+json">

    <!-- Fonts, self-hosted (Arabic-first). Tajawal is the only Arabic face;
         Plus Jakarta Sans covers Latin + numerals. Cairo and Fraunces were
         dropped earlier (see index.css) — neither ever painted.

         Self-hosting removes both fonts.googleapis/gstatic preconnects and the
         render-blocking cross-origin Google Fonts stylesheet (~840 ms on a 4G
         profile). @font-face lives in client/src/index.css; the woff2 files in
         client/public/fonts. Only the weights in use ship: Tajawal 400/500/700/
         800 (Arabic subset) and Plus Jakarta Sans 400..800 (one variable file,
         Latin subset). font-display: swap so text paints immediately.

         Preload the three faces the first viewport needs (Arabic H1/body +
         Latin brand/numerals) so their fetch starts with the HTML, not only
         after the stylesheet is parsed. crossorigin is required for font
         preloads even same-origin. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/tajawal-arabic-700.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/tajawal-arabic-400.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/plus-jakarta-sans-latin-var.woff2" crossorigin>
    <style>
      body { font-family: 'Plus Jakarta Sans', 'Tajawal', system-ui, sans-serif; background-color: #FFFFFF; color: #1C1C1E; }
      .dark body { background-color: #0F1115; color: #F2F3F5; }
    </style>
    <script>
      // Anti-FOUC: apply the persisted (or OS-preferred) theme before first
      // paint so dark-mode users never see a white flash. Kept in sync with
      // client/src/contexts/ThemeContext.tsx (localStorage key: "theme").
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme = stored === "light" || stored === "dark"
            ? stored
            : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          var root = document.documentElement;
          if (theme === "dark") {
            root.classList.add("dark");
            root.style.colorScheme = "dark";
          } else {
            root.style.colorScheme = "light";
          }
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "dark" ? "#0F1115" : "#FFFFFF");
        } catch (e) {
          /* ignore — storage unavailable */
        }
      })();
    </script>
    <meta name="google-site-verification" content="lNnaQsehc6JyU_JHI3aLsxGpNqonOU5DHJQr3CPS_Z8" />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
