    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://altusplace.ma/#website",

            }
          },
          {
            "@type": "Organization",
            "@id": "https://altusplace.ma/#organization",
            "name": "ALTUSplace",

            "logo": "https://altusplace.ma/images/logo.png",

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- LCP: preload the homepage hero image (matches Home.tsx, fetchpriority high) -->
    <link rel="preload" as="image" fetchpriority="high" href="https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&q=80&w=900">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..700&family=Tajawal:wght@300;400;500;700;800&family=Cairo:wght@200..900&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Plus Jakarta Sans', 'Tajawal', 'Cairo', system-ui, sans-serif; background-color: #FFFFFF; color: #1C1C1E; }
      .dark body { background-color: #0F1115; color: #F2F3F5; }
    </style>
    <script>
      // Anti-FOUC: apply the persisted (or OS-preferred) theme before first
      // paint so dark-mode users never see a white flash. Kept in sync with
      // client/src/contexts/ThemeContext.tsx (localStorage key: "theme").
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme = stored === "light" || stored === "dark"
            ? stored
            : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          var root = document.documentElement;
          if (theme === "dark") {
            root.classList.add("dark");
            root.style.colorScheme = "dark";
          } else {
            root.style.colorScheme = "light";
          }
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "dark" ? "#0F1115" : "#FFFFFF");
        } catch (e) {
          /* ignore — storage unavailable */
        }
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
