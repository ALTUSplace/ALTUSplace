<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0A192F; color: #ffffff; }
    .slide-container {
      width: 1280px;
      min-height: 720px;
      background: linear-gradient(135deg, #0A192F 0%, #0B3C5D 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 60px 80px;
      position: relative;
      overflow: hidden;
    }
    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(229, 124, 35, 0.15);
      border: 1px solid rgba(229, 124, 35, 0.4);
      padding: 8px 20px;
      border-radius: 30px;
      color: #E57C23;
      font-size: 16px;
      font-weight: 600;
      width: fit-content;
    }
    .hero-content {
      max-width: 900px;
      margin-top: 20px;
    }
    h1 {
      font-size: 56px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 24px;
      color: #ffffff;
    }
    h1 span {
      color: #E57C23;
    }
    p.subtitle {
      font-size: 24px;
      color: #94A3B8;
      line-height: 1.6;
      margin-bottom: 40px;
    }
    .footer-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 30px;
    }
    .presenter {
      font-size: 16px;
      color: #CBD5E1;
    }
    .logo-mark {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #ffffff;
      background: #E57C23;
      padding: 10px 20px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="header-badge">
      <i class="fas fa-gem"></i> هوية العلامة التجارية والاستراتيجية البصرية
    </div>
    <div class="hero-content">
      <h1>منصة <span>ALTUSplace</span><br>هوية العلامة التجارية وإستراتيجية الشعار</h1>
      <p class="subtitle">الموسوعة الرسمية لتطوير الهوية البصرية لمنصة الوساطة الفاخرة لتأجير السيارات والعقارات في المغرب.</p>
    </div>
    <div class="footer-info">
      <div class="presenter">
        <strong>فريق الهندسة والتصميم التقني</strong> | أغسطس 2026
      </div>
      <div class="logo-mark">ALTUSplace</div>
    </div>
  </div>
</body>
</html>
