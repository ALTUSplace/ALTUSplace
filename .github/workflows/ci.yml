# Real CI gate.
#
# Until this existed, `main` was only protected by Vercel's two preview checks,
# which are a deploy, not a test run: a red test could not block a merge. These
# are the gates that were previously only ever run by hand.
#
# FUTURE WORK (deliberately not in this iteration):
#   - Playwright / e2e job. Four suites exist and all pass locally, but none can
#     run without a served build, so they need a second job that builds, serves
#     and waits for readiness:
#       scripts/verify-map-interactions.mjs        (27 checks; needs a
#           VITE_MAP_TEST_HOOK=1 build, because it drives window.__altusMap)
#       scripts/verify-city-selector-responsive.mjs (37 checks)
#       scripts/verify-navbar-clipping.mjs          (375/768/1024/1280)
#       scripts/verify-horizontal-scroll.mjs
#     All four honour BASE_URL, so they can target the served build as-is.
#
#     DONE, as a side effect: scripts/verify-hero-layout.mjs is no longer on
#     that list. It is wired as a gate below and needed the same
#     build-serve-wait shape, so the recipe now exists. The four above can
#     reuse it rather than reinventing it.
#   - Coverage reporting, and a required-checks branch protection rule so this
#     workflow is actually enforced rather than merely informative.
#
# The actions are pinned to current majors (checkout v7, setup-node v7,
# pnpm/action-setup v6) rather than the older v4s: the v4s declare a Node 20
# runtime, which GitHub has deprecated and now force-runs on Node 24, so they
# emit a warning on every run. Do not downgrade them without checking that
# warning is gone.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same ref makes the previous run's results obsolete, so drop
# it. Group is per-ref, so PRs do not cancel main's own pushes (or each other).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # Reads the exact pnpm version from the `packageManager` field in
      # package.json (pnpm@10.4.1) and activates it through corepack, so CI can
      # never silently drift onto a different package manager than local dev.
      # No `version:` input on purpose — pinning it here as well would be a
      # second place to update, and this action fails if the field is absent.
      #
      # Its own `cache` input is left at its default (false): caching is done
      # once, by setup-node below, rather than by both actions.
      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      # 24 to match local dev (v24.19.0). `cache: pnpm` keys the dependency
      # layer on the resolved pnpm store and the committed lockfile.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      # --frozen-lockfile is the point of this step: it fails if
      # package.json and pnpm-lock.yaml have drifted apart in a commit, which is
      # otherwise only discovered by whoever installs next.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Journal-completeness gate. Deliberately the first step, and deliberately
      # before `pnpm install`: it uses only node:fs, needs no dependencies, and
      # is therefore the cheapest possible failure.
      #
      # An unjournaled .sql shipped once already. migrate.mjs iterates
      # _journal.json and never lists drizzle/, so drizzle/0020_detailed_ratings.sql
      # was silently inert in every environment while the application code queried
      # its columns -- production returned SQLSTATE 42703 on every listing page and
      # nothing in CI noticed. The same step also runs as a pre-commit hook via
      # husky; the logic is additionally covered by
      # scripts/check-migration-journal.test.ts under "Unit tests" below.
      - name: Migration journal completeness
        run: node scripts/check-migration-journal.mjs

      - name: Typecheck
        run: pnpm check

      # `pnpm test` is `vitest run`, invoked bare.
      #
      # This step previously passed `--exclude server/imageWatermark.test.ts`.
      # That exclusion existed only while the watermark work was untracked local
      # WIP, so on CI it matched nothing; left in place it would have silently
      # suppressed the only coverage of applyListingWatermark now that the file
      # is committed. The suite runs in ~1s here, well inside the 5s the old
      # comment claimed it exceeded, so nothing else needed changing.
      #
      # Note vitest.config.ts has no `exclude`, so a CLI --exclude would replace
      # the default list wholesale. Running bare avoids that entirely, and is
      # safe because `include` is scoped to *.test.ts / *.spec.ts under
      # server|client|tests|scripts, so stray tooling scripts are never
      # collected.
      - name: Unit tests
        run: pnpm test

      # Guards the shared/listingCategory.ts contract directly, including that
      # the client and server no longer carry separate word lists. Cheaper and
      # stricter than inferring the same thing from the unit tests.
      - name: Category classifier probe
        run: node scripts/probe-category-classifier.mjs

      # No env block. Verified that the build does not require one:
      #   - every VITE_* read in the client is defensive (`?? ""`, `|| undefined`,
      #     `as string | undefined`), so a missing token inlines as undefined
      #     rather than throwing at build time;
      #   - scripts/sitemap.mjs and scripts/prerender.mjs both fall back to
      #     https://altusplace.vercel.app and sitemap.mjs degrades to static
      #     routes only when DATABASE_URL is absent;
      #   - the server bundle is built with esbuild, which does not inline
      #     process.env, so runtime secrets are not needed to build.
      #
      # KNOWN LIMITATION: this makes CI's artifact differ from Vercel's, which
      # builds with real VITE_* values. CI therefore cannot catch a regression
      # that only appears with a real token present. Wiring repository secrets
      # into this job would close that, at the cost of CI depending on prod
      # credentials. Deliberately left out of this iteration.
      - name: Build
        run: pnpm build

      # Hero layout gate. Runs the BUILT client, not the dev server: the dev
      # server's CSP blocks Vite's React-Fast-Refresh preamble, so the SPA never
      # mounts and #root stays empty — the built shell is the only faithful thing
      # to measure (see scripts/serve-dist.mjs).
      #
      # Must run after Build. It was previously manual-only, which meant 239
      # lines of hero geometry checks could rot unnoticed; that is why it is a
      # gate now rather than a script nobody runs.
      #
      # `playwright install --with-deps chromium` is required because the
      # browsers are not vendored. --with-deps also pulls the shared libraries
      # (libnss3, libatk, …) that a bare ubuntu-latest image lacks.
      #
      # The server is backgrounded and torn down by a trap so a failing check
      # does not leave a listener holding the job open. Readiness is polled
      # rather than slept on, so a slow runner does not produce a false pass.
      - name: Hero layout gate
        run: |
          pnpm exec playwright install --with-deps chromium
          node scripts/serve-dist.mjs 4173 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4173/ -o /dev/null; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "server never became ready on :4173"
              exit 1
            fi
            sleep 1
          done
          node scripts/verify-hero-layout.mjs

      # Migration/schema parity. Replays all 19 migrations from scratch into one
      # throwaway database, applies what drizzle/schema.ts declares into a second,
      # and compares the two catalogs. Both live in an ephemeral postgres
      # container that the script deletes on exit; no real database is involved.
      #
      # The journal gate above proves a migration is *registered*. This proves the
      # registered migrations actually *build the schema the application reads* --
      # the gap that produced SQLSTATE 42703 on every listing page.
      #
      # Blocking. This used to carry `continue-on-error: true` because the gate had
      # never been executed -- the machine it was written on has no Docker and no
      # Postgres, so whether a clean main passed was an assumption, not a measured
      # fact. Advisory landing meant the first real run could neither block a merge
      # nor turn the gates red on unrelated work.
      #
      # That precondition is now met: the first real run (CI run 36635706008 on
      # PR #25) reported "PARITY OK", with 625 catalog lines on the migrated side
      # and 625 on the declared side. Note that under `continue-on-error: true` the
      # Actions UI reports a *failed* step as `success`, so the raw log is the only
      # trustworthy signal -- do not trust the checkmark when reading this gate.
      #
      # The original note asked for this promotion to land in its own PR. It rode in
      # with #25 instead, so that the hand-written 0021 migration could not reach
      # main on an advisory gate. Splitting it out afterwards is still worthwhile if
      # a separately-reviewed promotion is preferred.
      - name: Migration schema parity
        run: pnpm check:schema-parity

      # Sub-AA contrast token regression guard. Blocking, and currently passing.
      #
      # PR #20 (c911da6, "mass remediation of sub-AA slate text tokens") cleared
      # these from the tree, so a full scan of main finds zero -- 204 .tsx/.ts
      # files under client/src and nothing matching. This step therefore fails
      # only when one is reintroduced, which is the point of it.
      #
      # Scoped to client/src/ because that is where the remediated class names
      # were used. (A wider scan of server/, shared/, api/, e2e/ and tests/ on
      # main is also clean, so widening the path is available if new UI code ever
      # lands outside client/.)
      #
      # Path note: originally specified as src/, but there is no src/ at the repo
      # root. That is not cosmetic -- grep on a missing directory exits 2, not 1,
      # so `... && exit 1 || echo OK` would take the `||` branch and pass
      # unconditionally, i.e. never fail. Against the old path this would have
      # been a check that only looked like coverage.
      - name: Verify no sub-AA contrast tokens remain
        run: |
          grep -rE "text-slate-400|text-gray-500" client/src/ --include="*.tsx" --include="*.ts" && exit 1 || echo "OK"

  # Secret scanning. A separate job from `gates` on purpose: it needs no
  # toolchain, no pnpm install and no database, so it stays fast, and a secret
  # finding can never be masked by an unrelated build failure. It runs on every
  # pull request to main and on every push to main.
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history. `gitleaks detect` reports findings per commit, so a
          # shallow clone would hide any secret committed outside the fetched
          # window -- which is exactly the case worth catching.
          fetch-depth: 0

      # `.gitleaks.toml` extends the upstream default rules and narrows only the
      # literals that are legitimately non-secret in this repo: the tracked
      # .env contract files, `+2126XXXXXXXX` phone placeholders, and the fixed
      # `postgres:postgres` default used by the ephemeral CI database.
      #
      # `--redact` keeps any value out of the log. `--exit-code 1` makes a
      # finding a hard failure rather than a warning.
      #
      # If this step ever fails: the secret must be treated as compromised and
      # rotated in its provider. Deleting it from the working tree is not
      # sufficient, because it is already in git history.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --source . --config .gitleaks.toml --exit-code 1 --redact --verbose
