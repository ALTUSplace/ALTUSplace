# Real CI gate.
#
# Until this existed, `main` was only protected by Vercel's two preview checks,
# which are a deploy, not a test run: a red test could not block a merge. These
# are the gates that were previously only ever run by hand.
#
# FUTURE WORK (deliberately not in this iteration):
#   - Playwright / e2e job. Four suites exist and all pass locally, but none can
#     run without a served build, so they need a second job that builds, serves
#     and waits for readiness:
#       scripts/verify-map-interactions.mjs        (27 checks; needs a
#           VITE_MAP_TEST_HOOK=1 build, because it drives window.__altusMap)
#       scripts/verify-city-selector-responsive.mjs (37 checks)
#       scripts/verify-navbar-clipping.mjs          (375/768/1024/1280)
#       scripts/verify-horizontal-scroll.mjs
#     All four honour BASE_URL, so they can target the served build as-is.
#   - Coverage reporting, and a required-checks branch protection rule so this
#     workflow is actually enforced rather than merely informative.
#
# The actions are pinned to current majors (checkout v7, setup-node v7,
# pnpm/action-setup v6) rather than the older v4s: the v4s declare a Node 20
# runtime, which GitHub has deprecated and now force-runs on Node 24, so they
# emit a warning on every run. Do not downgrade them without checking that
# warning is gone.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same ref makes the previous run's results obsolete, so drop
# it. Group is per-ref, so PRs do not cancel main's own pushes (or each other).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # Reads the exact pnpm version from the `packageManager` field in
      # package.json (pnpm@10.4.1) and activates it through corepack, so CI can
      # never silently drift onto a different package manager than local dev.
      # No `version:` input on purpose — pinning it here as well would be a
      # second place to update, and this action fails if the field is absent.
      #
      # Its own `cache` input is left at its default (false): caching is done
      # once, by setup-node below, rather than by both actions.
      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      # 24 to match local dev (v24.19.0). `cache: pnpm` keys the dependency
      # layer on the resolved pnpm store and the committed lockfile.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      # --frozen-lockfile is the point of this step: it fails if
      # package.json and pnpm-lock.yaml have drifted apart in a commit, which is
      # otherwise only discovered by whoever installs next.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      # `pnpm test` is `vitest run`, and pnpm forwards trailing args to the
      # script (verified: it resolves to `vitest run "--exclude ..."`).
      #
      # server/imageWatermark.test.ts is excluded because it is untracked local
      # work, unrelated to this repo's committed suite, and it times out at 5s
      # where every other file passes. It is not in git, so on CI this exclude
      # matches nothing today; it is kept so the gate stays green if that file
      # is ever committed, instead of the workflow needing a rewrite then.
      #
      # Note vitest has no `exclude` in vitest.config.ts, so a CLI --exclude
      # replaces the default list (node_modules, dist, ...). That is safe here
      # only because `include` is scoped to server|client|tests|scripts/**, so
      # nothing outside the repo is ever collected anyway.
      - name: Unit tests
        run: pnpm test -- --exclude "server/imageWatermark.test.ts"

      # Guards the shared/listingCategory.ts contract directly, including that
      # the client and server no longer carry separate word lists. Cheaper and
      # stricter than inferring the same thing from the unit tests.
      - name: Category classifier probe
        run: node scripts/probe-category-classifier.mjs

      # No env block. Verified that the build does not require one:
      #   - every VITE_* read in the client is defensive (`?? ""`, `|| undefined`,
      #     `as string | undefined`), so a missing token inlines as undefined
      #     rather than throwing at build time;
      #   - scripts/sitemap.mjs and scripts/prerender.mjs both fall back to
      #     https://altusplace.vercel.app and sitemap.mjs degrades to static
      #     routes only when DATABASE_URL is absent;
      #   - the server bundle is built with esbuild, which does not inline
      #     process.env, so runtime secrets are not needed to build.
      #
      # KNOWN LIMITATION: this makes CI's artifact differ from Vercel's, which
      # builds with real VITE_* values. CI therefore cannot catch a regression
      # that only appears with a real token present. Wiring repository secrets
      # into this job would close that, at the cost of CI depending on prod
      # credentials. Deliberately left out of this iteration.
      - name: Build
        run: pnpm build
